name: Update Google Scholar Citations

on:
  # Scheduled fetching is paused until a verified profile is configured.
  # Restore the M/W/F schedule only after following docs/SCHOLAR_CITATIONS.md.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: Install citation dependencies
        run: python -m pip install -r bin/requirements-scholar.txt
      - name: Validate profile configuration
        run: python -c "import runpy; runpy.run_path('bin/update_scholar_citations.py', run_name='config_check')"
      - name: Run citation updater regression tests
        run: python -m unittest discover -s test -p 'test_scholar_citations.py'
      - name: Update citations
        run: timeout 90 python bin/update_scholar_citations.py
      - name: Commit and push if changed
        run: |
          git add _data/citations.yml
          if ! git diff --staged --quiet; then
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git commit -m "Update Google Scholar citations"
            git push
          fi
      - name: Report failure
        if: failure()
        run: echo "Citation update failed; no successful refresh is claimed." >> "$GITHUB_STEP_SUMMARY"
