cv:
  name: Renatto Tommasi Hernández
  label: Full Stack Robotics Engineer
  email: renatto.tommasi@gmail.com
  location: Budapest, Hungary
  image: ""
  summary: >
    Full Stack Robotics Engineer who takes autonomous mobile robots from raw sensor data
    to a reliable state estimate on real hardware, in the field. Owns the perception and
    localization stack of an autonomous ground vehicle in C++17 and Python (ROS 2): sensor
    bringup and intrinsic/extrinsic calibration, multi-camera visual odometry and SLAM,
    depth-image and point-cloud processing, free-space and obstacle estimation, and
    multi-sensor fusion through factor-graph optimization (GTSAM) on SE(3), optimized for
    NVIDIA Jetson edge hardware. Fluent in coordinate frames, rigid-body transforms
    (SO(3)/SE(3)) and 3D geometry, and comfortable bisecting a stack across sensor drivers,
    timing, networking, and geometric logic to find where reality and the math disagree.
    Builds the validation infrastructure that proves it works: Isaac Sim digital twins for
    simulation-first testing before every hardware deployment, large-scale ROS-bag
    field-data collection and replay for repeatable metrics, and 3D visualization in
    Foxglove and RViz to diagnose real-world failure modes. Hardware-native mechatronics
    background, first-author SLAM publication, and a decade in competitive robotics.

  social_networks:
    - network: GitHub
      username: renatto-tommasi
    - network: LinkedIn
      username: rtommasi

  sections:
    Education:
      - studyType: M.Sc. Intelligent Field Robotics Systems
        institution: Universitat de Girona / University of Zagreb
        area: Erasmus Mundus Joint Masters Scholar
        location: Spain / Croatia
        start_date: "2023-08"
        end_date: "2025-07"
        highlights:
          - "**Relevant coursework:** Hands-on Localization (10.0/10), Hands-on Perception (9.6/10), Robot Sensing, Perception and Actuation (9.6/10), Hands-on Planning (9.4/10), Machine Learning (8.4/10), Probabilistic Robotics, Multiview Geometry"
          - "**GPA:** 8.75/10 · **Thesis grade:** 9.1/10"
          - "**Thesis:** Enhancing Indoor Mapping and Localization in Specular-Rich Environments using Deep Learning and Sensor Fusion"

      - studyType: B.Sc. Mechatronics Engineering
        institution: Tecnológico de Monterrey (ITESM) / Hochschule Mannheim
        area: DHIK international double-degree programme
        location: Mexico / Germany
        start_date: "2018-08"
        end_date: "2023-06"
        highlights:
          - Double degree at Hochschule Mannheim (DHIK programme, 17 months of coursework, internship and thesis)
          - ITESM Scholarship for Excellence in Leadership · DHIK–DAAD scholarship holder
          - "**Relevant coursework:** Machine Vision & Autonomous Driving, Robotics, Industrial Robotics, Control Engineering, Signal & System Analysis, Mechatronics Design, Microcontrollers"
          - "**GPA:** 89.04/100 · **Thesis grade:** 1.0 (German scale)"
          - "**Thesis:** Application of a force-torque sensor for the control of robotic drilling processes"

    Experience:
      - company: European Knowledge Centre (EKC)
        position: Senior Robotics Engineer
        location: Budapest, Hungary
        start_date: "2026-04"
        end_date: present
        summary: >
          End-to-end ownership of perception and state estimation on the ViroFighter
          autonomous UGV.
        highlights:
          - "**ViroFighter Autonomous UGV — Perception & State Estimation:** own the real-time perception and localization stack (ROS 2, C++17, Python), from raw sensor drivers to the poses and free-space estimates consumed by planning and control. Cut angular drift 95% by fusing multi-camera visual odometry (four fisheye cameras, SuperPoint features), RGB-D point clouds and wheel odometry in a factor graph on SE(3) (GTSAM)"
          - "**Sensor Integration & Edge Deployment:** bringup, intrinsic/extrinsic calibration and time synchronization of the wide-FOV fisheye and RGB-D suite; optimized and deployed the stack to NVIDIA Jetson (Isaac ROS) under real-time constraints"
          - "**Field Data & Validation Tooling:** large-scale ROS-bag field-data collection and replay for metric-driven benchmarking, live logging to reproduce real-world failure modes, and 3D visualization of point clouds, trajectories and frames in Foxglove and RViz. Docker CI across the stack"
          - "**ROS 2 Fleet Migration & Simulation-First Validation:** oversee the ROS 1 → ROS 2 migration of the robot fleet, and built the Isaac Sim environment used to develop and validate perception, localization and navigation before every hardware deployment"
          - "**Applied Research Supervision:** supervise two industrial M.Sc. theses — vision-language models for semantic localization, and behaviour cloning with actor–critic refinement in Nav2 — merging into one end-to-end vision-language-action architecture on a real mobile robot"

      - company: European Knowledge Centre (EKC)
        position: ESA Payload Systems Engineer
        location: Budapest, Hungary
        start_date: "2026-04"
        end_date: present
        summary: >
          Systems engineering for the prime contractor on an ESA ISS payload.
        highlights:
          - Systems Engineer for the Prime Contractor on an ESA ISS payload flying a point-of-care hematology analyser with minimal modification to the commercial device
          - Lead the consortium's engineering effort with Airbus Defence and Space and report technical progress to ESA under ECSS standards toward PDR
          - Own payload design and product assurance across a multidisciplinary team of software, electrical, mechanical and systems engineers

      - company: European Knowledge Centre (EKC)
        position: AI & Robotics Engineer
        location: Budapest, Hungary
        start_date: "2025-07"
        end_date: "2026-04"
        highlights:
          - "**Medical AI Team Lead (HUNOR ISS Mission):** led the medical-AI team, in collaboration with Semmelweis University, that developed AI-assisted diagnostic and health-monitoring tools for the HUNOR programme that flew a Hungarian astronaut to the ISS — an activity and fitness tracker, a cuffless blood-pressure estimator, and a denoising filter for the Astroskin biometric sensor suit, all trained and validated on noisy real-world wearable sensor data"
          - "**ViroFighter Debugging & System Testing (ROS 1):** owned debugging and system-level testing of the ViroFighter autonomous UGV on its ROS 1 Melodic stack — reproducing field failures and isolating faults across sensor drivers, timing and network layers, localization, and geometric/calibration logic to determine whether a bug lived in the hardware, the data, or the math"
          - "**Computer-Vision Quality Assurance (Mylan):** built an automated optical inspection station in C# for a pharmaceutical packaging line, detecting print defects on the backing foil of medicine blister packs at end of line — image acquisition, defect detection and pass/fail decisioning integrated into the production QA workflow"
          - "**Emerging Perception Technology:** evaluated and shipped a DINOv3 foundation-model anomaly detector to production (adopted by Airbus Geo, 50% less data-cleaning time), assessing accuracy, runtime cost and production readiness against classical baselines"

      - company: European Knowledge Centre (EKC)
        position: Intern — Robotic Perception & Localization
        location: Budapest, Hungary
        start_date: "2025-02"
        end_date: "2025-06"
        highlights:
          - "**Free-Space Estimation & Sensor Noise Rejection:** developed a Support Vector Machine (SVM) classifier to reject reflection artifacts from Intel RealSense depth data, improving free-space and obstacle estimation in perceptually challenging (specular) environments. Supported calibration and time synchronization between the four wide-FOV fisheye cameras and the RGB-D cameras"
          - Prototyped the multi-camera visual odometry pipeline (four fisheye cameras, SuperPoint deep-learning features, GTSAM graph optimization) that matured into the ViroFighter localization stack, cutting angular drift by 95%

      - company: Robert Bosch Power Tools GmbH
        position: Intern & Bachelor Thesis Student — Robotic Automation
        location: Germany
        start_date: "2022-04"
        end_date: "2023-03"
        highlights:
          - "**Manipulator Work Cell (UR16e):** designed and built the electromechanical test bench for a UR16e-based robotic drilling system destined for an autonomous drilling AGV — interfacing with the arm's control software to command end-effector poses across the workspace and closing the loop with real-time sensor feedback on physical hardware"
          - "**Sensing & Low-Level Integration:** developed a redundant force-torque sensing system (F/T sensor, accelerometer, motor current) for real-time characterization of contact forces and torques across drilling poses, including data acquisition, synchronization and analysis of the multi-sensor streams"

    Projects:
      - name: Aerial Robotics — Vision-Based State Estimation
        date: "2024"
        highlights:
          - Deployed ORB-SLAM2 for robust, purely vision-based state estimation and localization on a Tello UAV in GPS-denied environments

      - name: Multi-Object Tracking using Kalman Filter on Event-Based Data
        date: "2023"
        highlights:
          - Implemented a high-frequency Kalman Filter for trajectory and velocity estimation from asynchronous Dynamic Vision Sensor (DVS) streams, engineering the data pipeline around continuous, microsecond-resolution events rather than synchronous frames for low-latency tracking

      - name: Autonomous Navigation onboard a TurtleBot 3
        date: "2023"
        highlights:
          - Feature-based Graph SLAM localization using ArUco marker landmarks and the GTSAM library
          - Behavior-tree exploration with frontier-based RRT* planning under kinematic constraints, pure-pursuit PID path tracking, and a task-priority forward-kinematics manipulator controller for object intervention

      - name: FIRST Robotics Competition (FRC)
        start_date: "2017"
        end_date: "2023"
        highlights:
          - Founder, former captain and mentor of the Prepa Tec Daedalus 7102 team; robot inspector certifying 50 industrial-category robots against FRC event regulations

